name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vet:
    name: build+vet (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs_on: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "1"
            apt: true
          - name: windows
            runs_on: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            apt: false
          - name: js-wasm
            runs_on: ubuntu-latest
            goos: js
            goarch: wasm
            cgo: "0"
            apt: false
          - name: darwin
            # Cross-compiling darwin with CGO_ENABLED=0 is not enough here:
            # window/window_darwin.go already needs the Cocoa/QuartzCore
            # bridge in window_cgo_darwin.go (tag "darwin && cgo") for
            # everything except the new no-op SetAppID, so a real macOS
            # runner (free for public repos, no cross-toolchain to fake) is
            # the simplest way to actually validate this build tag.
            runs_on: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            apt: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native build dependencies (linux only)
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libglvnd-core-dev

      # go-wayland-cube is excluded on purpose: it hard-depends on
      # ./libwayland (a cgo bridge to the system libwayland C headers, linux
      # only by construction) and on a pinned github.com/vulkan-go/vulkan
      # whose API no longer matches this file's usage even on native linux
      # with cgo enabled (undefined vulkan.CreateWaylandSurface and friends).
      # That is a pre-existing break unrelated to build tags/platforms, and
      # tracking it is outside the scope of this CI workflow.
      - name: Compute build target (everything except go-wayland-cube)
        id: pkgs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          echo "list=$(go list -e ./... | grep -v '/go-wayland-cube$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build ${{ steps.pkgs.outputs.list }}

      # -unsafeptr=false: libdecor and libwayland are purego FFI bridges that
      # round-trip pointers through uintptr by construction (calling into a
      # dynamically loaded C library without cgo) - the standard, accepted
      # reason to turn this one analyzer off for this kind of code.
      - name: go vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go vet -unsafeptr=false ${{ steps.pkgs.outputs.list }}

  e2e-smoke:
    name: e2e smoke (headless weston)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install weston and Wayland/xkb runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston libwayland-dev libxkbcommon-dev

      - name: Build the CI smoke client
        run: go build -o /tmp/go-wayland-ci-smoke ./go-wayland-ci-smoke

      - name: Start headless weston
        run: |
          mkdir -p /tmp/xdg-runtime
          chmod 700 /tmp/xdg-runtime
          echo "XDG_RUNTIME_DIR=/tmp/xdg-runtime" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR=/tmp/xdg-runtime WAYLAND_DEBUG=1 \
            weston --backend=headless-backend.so --socket=wayland-ci --idle-time=0 \
            > /tmp/weston.log 2>&1 &
          echo "Waiting for the Wayland socket to appear..."
          for i in $(seq 1 30); do
            if [ -S "/tmp/xdg-runtime/wayland-ci" ]; then
              echo "weston is up after ${i}s"
              break
            fi
            sleep 1
          done
          if [ ! -S "/tmp/xdg-runtime/wayland-ci" ]; then
            echo "weston did not create its socket in time"
            cat /tmp/weston.log || true
            exit 1
          fi

      - name: Run the real Wayland client against real headless weston
        run: |
          /tmp/go-wayland-ci-smoke "org.unxed.wayland.ci-smoke"

      - name: Verify xdg_toplevel.set_app_id actually reached the compositor
        run: |
          echo "--- weston log (tail) ---"
          tail -n 100 /tmp/weston.log || true
          if grep -q "set_app_id" /tmp/weston.log; then
            echo "OK: set_app_id request found in the compositor's protocol log"
          else
            echo "FAIL: set_app_id was not seen in the compositor's protocol log"
            exit 1
          fi

      - name: Stop weston
        if: always()
        run: pkill -f 'weston --backend=headless-backend.so' || true

      - name: Upload weston log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weston-log
          path: /tmp/weston.log
          if-no-files-found: ignore
